<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Emerald Leaf Gradient -->
    <linearGradient id="favEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <!-- Amber Growth Arrow Gradient -->
    <linearGradient id="favAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base for High Contrast on Light/Dark Browser Tabs -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Logo Mark: 'H' Monogram with Sprout Leaf & Upward Surge Arrow -->
  <g filter="url(#favGlow)">
    <!-- Left Leaf Pillar (Organic Creator Growth) -->
    <path d="M 17 49 L 17 25 C 17 17 22 13 28 13 C 28 22 23 29 23 35 L 23 49 C 23 51 21 52 19.5 52 C 18 52 17 51 17 49 Z" fill="url(#favEmerald)" />

    <!-- Dynamic Crossbar Connection -->
    <path d="M 21 34 L 41 29 C 43 28.5 45 30 45 32 C 45 34 43 35.5 41 36 L 21 41 C 19 41.5 17 40 17 38 C 17 36 19 34.5 21 34 Z" fill="url(#favEmerald)" opacity="0.95" />

    <!-- Right Pillar (Monetization & Velocity Surge) -->
    <path d="M 39 49 C 37.5 49 36 48 36 46 L 36 28 C 36 26.5 37.5 25 39 25 C 40.5 25 42 26.5 42 28 L 42 46 C 42 48 40.5 49 39 49 Z" fill="url(#favAmber)" />

    <!-- Upward Growth Arrow Head -->
    <polygon points="39,11 49,24 43,24 43,29 35,29 35,24 29,24" fill="url(#favAmber)" />

    <!-- Prosperity Spark Dot -->
    <circle cx="49.5" cy="13.5" r="2.5" fill="#FDE047" />
  </g>
</svg>