name = "herewegrow-app"
main = "worker/index.ts"
compatibility_date = "2025-03-01"
# Keep variables set in the Cloudflare dashboard when deploying from GitHub
keep_vars = true

# Secrets (set in Cloudflare → Workers & Pages → herewegrow-app → Settings → Variables and secrets):
#   PAYMENT_API_KEY   Paymently / UddoktaPay API key (type: Secret)
# Optional plain variable:
#   PAYMENT_API_BASE  defaults to https://herewegrow.paymently.io/api
#   DOWNLOAD_SECRET   optional; signs download links (falls back to PAYMENT_API_KEY)
#   SESSION_SECRET    required for login: any long random string (type: Secret)
#   SMS_API_KEY, SMS_SENDER_ID   BulkSMSBD account (login codes)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   Google sign-in (optional until ready)
#   TURNSTILE_SECRET  optional; turns on the captcha check for login codes

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Send /api/* to the Worker first so the payment API is never answered with the web page
run_worker_first = ["/api/*", "/careers", "/careers/*", "/sitemap-careers.xml", "/blog", "/blog/*", "/sitemap-blog.xml", "/admin-blog-seed.json"]

# Private storage for the paid Word files and pack zips (never public).
# Create the bucket first: Cloudflare → R2 → Create bucket → herewegrow-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "herewegrow-files"

# Accounts and Pro passes (Phase 1). IDs are not secrets.
[[d1_databases]]
binding = "DB"
database_name = "herewegrow"
database_id = "5b9405db-d09f-468d-9c4e-6ace7d9735d8"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "1a43543598fd451383f8c14162938c7e"

# Pro renewal reminders by SMS, once a day at 09:31 Bangladesh time (03:31 UTC)
[triggers]
crons = ["31 3 * * *"]

# Workers Logs (matches the dashboard setting, so deploys don't turn it off)
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
