name = "herewegrow-app"
main = "worker/index.ts"
compatibility_date = "2025-03-01"
# Keep variables set in the Cloudflare dashboard when deploying from GitHub
keep_vars = true

# Secrets (set in Cloudflare → Workers & Pages → herewegrow-app → Settings → Variables and secrets):
#   PAYMENT_API_KEY   Paymently / UddoktaPay API key (type: Secret)
# Optional plain variable:
#   PAYMENT_API_BASE  defaults to https://herewegrow.paymently.io/api
#   DOWNLOAD_SECRET   optional; signs download links (falls back to PAYMENT_API_KEY)

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Send /api/* to the Worker first so the payment API is never answered with the web page
run_worker_first = ["/api/*"]

# Private storage for the paid Word files and pack zips (never public).
# Create the bucket first: Cloudflare → R2 → Create bucket → herewegrow-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "herewegrow-files"

# Workers Logs (matches the dashboard setting, so deploys don't turn it off)
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
