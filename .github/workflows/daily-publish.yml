name: Daily publish
# Blog posts carry a publishDate in content/blog/*.md. A post goes live when the site is rebuilt on
# or after that date, so this job asks Cloudflare to rebuild every night just after midnight in
# Bangladesh (00:05, which is 18:05 UTC the day before).
#
# One-time setup: in Cloudflare → Workers & Pages → herewegrow-app → Settings → Builds,
# create a Deploy hook, then in GitHub → Settings → Secrets and variables → Actions add it as
# the secret CF_DEPLOY_HOOK_URL. Until the secret exists this job does nothing.
on:
  schedule:
    - cron: '5 18 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
